# Builds the api-cli/ Go CLI (mineru-cli) for Linux/macOS/Windows on amd64+arm64
# and publishes the binaries as a GitHub Release.
name: mineru-cli-release

on:
  push:
    branches:
      - "feature/kaihang"
    paths:
      - "api-cli/**"
      - ".github/workflows/api-cli-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v0.1.0 (default: dev-<short-sha>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Compute version and release tag
        id: vars
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=api-cli-${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: api-cli/go.mod
          cache-dependency-path: api-cli/go.sum

      - name: Build
        working-directory: api-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X mineru-cli/cmd.Version=${{ needs.prepare.outputs.version }}" \
            -o "dist/mineru-cli${ext}" .

      - name: Package
        working-directory: api-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # Deliberately version-free: keeps /releases/latest/download/<name> working
          # across releases instead of only ever matching one version.
          name="mineru-cli_${GOOS}_${GOARCH}"
          mkdir -p archives
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q "../archives/${name}.zip" "mineru-cli.exe")
          else
            tar -C dist -czf "archives/${name}.tar.gz" "mineru-cli"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.goos }}-${{ matrix.goarch }}
          path: api-cli/archives/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            api-cli/RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          merge-multiple: true
          path: archives

      - name: Checksums
        working-directory: archives
        run: sha256sum * > checksums.txt

      - name: Render release notes
        run: |
          set -euo pipefail
          sed \
            -e "s|__VERSION__|${{ needs.prepare.outputs.version }}|g" \
            -e "s|__TAG__|${{ needs.prepare.outputs.tag }}|g" \
            -e "s|__REPO__|${{ github.repository }}|g" \
            -e "s|__SHA__|${{ github.sha }}|g" \
            -e "s|__BRANCH__|${{ github.ref_name }}|g" \
            api-cli/RELEASE_NOTES.md > rendered-release-notes.md

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: mineru-cli ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: archives/*
          body_path: rendered-release-notes.md
